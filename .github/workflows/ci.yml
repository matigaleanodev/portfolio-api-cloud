name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      application: ${{ steps.scope.outputs.application }}
      infrastructure: ${{ steps.scope.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate documentation
        run: python3 scripts/check_docs.py
      - name: Detect application and infrastructure independently
        id: scope
        run: python3 scripts/ci_scope.py >> "$GITHUB_OUTPUT"

  application:
    needs: documentation
    if: needs.documentation.outputs.application == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: test
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:app
      - run: npm run test:tooling
      - run: npm run test:package

  infrastructure:
    needs: documentation
    if: needs.documentation.outputs.infrastructure == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      CDK_DEFAULT_ACCOUNT: '650387442642'
      CDK_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:infra
      - name: Synthesize test stack without AWS lookups
        run: npm run cdk -- synth --no-lookups --context stage=test
      - name: Assemble review bundle without credentials
        run: |
          python3 scripts/review_bundle.py create . .tmp/review-bundle "$GITHUB_SHA" "$(node --version)"
          python3 scripts/review_bundle.py verify .tmp/review-bundle "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: test-assembly-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/review-bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify:
    name: verify
    if: always()
    needs: [documentation, application, infrastructure]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      DOC_RESULT: ${{ needs.documentation.result }}
      APP_RESULT: ${{ needs.application.result }}
      INFRA_RESULT: ${{ needs.infrastructure.result }}
      APP_PRESENT: ${{ needs.documentation.outputs.application }}
      INFRA_PRESENT: ${{ needs.documentation.outputs.infrastructure }}
    steps:
      - name: Report required check accurately
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DOC_RESULT" == success ]]
          if [[ "$APP_PRESENT" == true ]]; then
            [[ "$APP_RESULT" == success ]]
            echo "Aplicación: tipos, build, contratos y paquete verificados en Node 24.22.1 LTS." >> "$GITHUB_STEP_SUMMARY"
          else
            [[ "$APP_PRESENT" == false && "$APP_RESULT" == skipped ]]
            echo "Aplicación inexistente: no se ejecutaron sus checks." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$INFRA_PRESENT" == true ]]; then
            [[ "$INFRA_RESULT" == success ]]
            echo "Infraestructura: tests y synth sin lookups verificados." >> "$GITHUB_STEP_SUMMARY"
          else
            [[ "$INFRA_PRESENT" == false && "$INFRA_RESULT" == skipped ]]
            echo "Stack inexistente: no se ejecutó synth." >> "$GITHUB_STEP_SUMMARY"
          fi
