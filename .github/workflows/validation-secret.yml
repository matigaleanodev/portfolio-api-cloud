name: Create isolated validation configuration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-api-cloud-test-mutation
  cancel-in-progress: false
jobs:
  create:
    if: github.repository == 'matigaleanodev/portfolio-api-cloud' && github.ref == 'refs/heads/main' && vars.TEST_SECRET_ENABLED == 'true'
    environment: test-foundation-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::650387442642:role/PortfolioApiCloudTestFoundationPlanRole
          allowed-account-ids: '650387442642'
          role-session-name: PortfolioApiCloudTestSecret-${{ github.run_id }}
      - name: Create fictitious provider configuration once
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 650387442642 ]]
          caller_arn=$(aws sts get-caller-identity --query Arn --output text)
          [[ "$caller_arn" == arn:aws:sts::650387442642:assumed-role/PortfolioApiCloudTestFoundationPlanRole/* ]]
          umask 077
          config=$(mktemp "$RUNNER_TEMP/validation-config.XXXXXX")
          trap 'rm -f "$config"' EXIT
          python3 - "$config" <<'PY'
          import json, secrets, sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          # Importe ficticio para admisión simulada; no configura el presupuesto real.
          Path(sys.argv[1]).write_text(json.dumps({
              'RESEND_API_KEY':'validation-only', 'OPENAI_API_KEY':'validation-only',
              'CONTACT_FROM_EMAIL':'from@example.invalid', 'CONTACT_TO_EMAIL':'to@example.invalid',
              'PORTFOLIO_CLOUD_API_URL':'https://cloud.example.invalid',
              'QUOTA_KEY_SECRET':secrets.token_hex(32), 'AI_DAILY_BUDGET_MICROUSD':'1000',
              'AI_PRICING_VALID_UNTIL':(datetime.now(timezone.utc)+timedelta(days=30)).isoformat(),
          }))
          PY
          arn=$(aws secretsmanager create-secret --region us-east-1 --name portfolio-api-cloud/test/validation --secret-string "file://$config" --client-request-token "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-validation-config" --query ARN --output text)
          echo "Referencia creada: $arn. Conservar clave de derivación; una repetición no reemplaza el secreto existente." >> "$GITHUB_STEP_SUMMARY"
