name: Plan production deployment

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Run CI por push de la revisión integrada
        type: string
        required: true
      artifact_id:
        description: Artifact api-assembly del run revisado
        type: string
        required: true
      reviewed_revision:
        description: SHA completo integrado y revisado
        type: string
        required: true
      reviewed_digest:
        description: Digest sha256 del artifact revisado en GitHub
        type: string
        required: true

      public_access:
        description: Exposicion publica tras validar candidata
        type: boolean
        default: false
      disable_default_endpoint:
        description: Cierre del execute-api tras verificar dominio definitivo
        type: boolean
        default: false
      cors_origin:
        description: Origenes HTTPS permitidos separados por coma
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: portfolio-api-cloud-production-mutation
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CDK_DEFAULT_ACCOUNT: '650387442642'
  CDK_DEFAULT_REGION: us-east-1

jobs:
  configuration:
    # Configuración no sensible del environment production: el job no autentica ni ejecuta código.
    if: github.repository == 'matigaleanodev/portfolio-api-cloud' && github.ref == 'refs/heads/main' && vars.PRODUCTION_PLAN_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      contact_from_email: ${{ vars.CONTACT_FROM_EMAIL }}
      contact_to_email: ${{ vars.CONTACT_TO_EMAIL }}
      ai_daily_budget_microusd: ${{ vars.AI_DAILY_BUDGET_MICROUSD }}
      ai_pricing_valid_until: ${{ vars.AI_PRICING_VALID_UNTIL }}
      r2_endpoint: ${{ vars.R2_ENDPOINT }}
      r2_bucket: ${{ vars.R2_BUCKET }}
      r2_subscribers_bucket: ${{ vars.R2_SUBSCRIBERS_BUCKET }}
      media_base_url: ${{ vars.MEDIA_BASE_URL }}
      blog_from_email: ${{ vars.BLOG_FROM_EMAIL }}
      certificate_arn: ${{ vars.CERTIFICATE_ARN }}
      alarm_topic_arn: ${{ vars.ALARM_TOPIC_ARN }}
    steps:
      # Solo expone variables no sensibles; el job prepare las valida antes de autenticar.
      - name: Read non-sensitive production configuration
        run: echo "Configuración no sensible leída del environment production." >> "$GITHUB_STEP_SUMMARY"

  prepare:
    needs: configuration
    if: github.repository == 'matigaleanodev/portfolio-api-cloud' && github.ref == 'refs/heads/main' && vars.PRODUCTION_PLAN_ENABLED == 'true'
    environment: production-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DISABLE_DEFAULT_ENDPOINT: ${{ inputs.disable_default_endpoint }}
      CERTIFICATE_ARN: ${{ needs.configuration.outputs.certificate_arn }}
      ALARM_TOPIC_ARN: ${{ needs.configuration.outputs.alarm_topic_arn }}
      PUBLIC_ACCESS: ${{ inputs.public_access }}
      CORS_ORIGIN: ${{ inputs.cors_origin }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      REVIEWED_REVISION: ${{ inputs.reviewed_revision }}
      REVIEWED_DIGEST: ${{ inputs.reviewed_digest }}
      PRODUCTION_CONTACT_FROM_EMAIL: ${{ needs.configuration.outputs.contact_from_email }}
      PRODUCTION_CONTACT_TO_EMAIL: ${{ needs.configuration.outputs.contact_to_email }}
      PRODUCTION_AI_DAILY_BUDGET_MICROUSD: ${{ needs.configuration.outputs.ai_daily_budget_microusd }}
      PRODUCTION_AI_PRICING_VALID_UNTIL: ${{ needs.configuration.outputs.ai_pricing_valid_until }}
      PRODUCTION_R2_ENDPOINT: ${{ needs.configuration.outputs.r2_endpoint }}
      PRODUCTION_R2_BUCKET: ${{ needs.configuration.outputs.r2_bucket }}
      PRODUCTION_R2_SUBSCRIBERS_BUCKET: ${{ needs.configuration.outputs.r2_subscribers_bucket }}
      PRODUCTION_MEDIA_BASE_URL: ${{ needs.configuration.outputs.media_base_url }}
      PRODUCTION_BLOG_FROM_EMAIL: ${{ needs.configuration.outputs.blog_from_email }}
      PRODUCTION_AWS_ROLE_ARN: ${{ vars.PRODUCTION_AWS_ROLE_ARN }}
      PRODUCTION_EXECUTION_ROLE_ARN: ${{ vars.PRODUCTION_EXECUTION_ROLE_ARN }}
      PRODUCTION_CDK_DEPLOY_ROLE_ARN: ${{ vars.PRODUCTION_CDK_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check prerequisites before authentication
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEWED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REVIEWED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test -f package.json
          test -f package-lock.json
          test -f cdk.json
          # Revalida lo recibido del job de configuración antes de usarlo como parámetros.
          address='^[^@]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}>?$'
          for value in "$PRODUCTION_CONTACT_FROM_EMAIL" "$PRODUCTION_CONTACT_TO_EMAIL" "$PRODUCTION_BLOG_FROM_EMAIL"; do
            [[ "$value" =~ $address && "$value" != *$'\n'* ]]
          done
          [[ "$PRODUCTION_AI_DAILY_BUDGET_MICROUSD" =~ ^([1-9][0-9]{0,5}|1000000)$ ]]
          [[ "$PRODUCTION_AI_PRICING_VALID_UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2}(\.[0-9]{1,3})?)?(Z|[+-][0-9]{2}:[0-9]{2})$ ]]
          [[ "$PRODUCTION_R2_ENDPOINT" =~ ^https://[A-Za-z0-9.-]+$ ]]
          [[ "$PRODUCTION_MEDIA_BASE_URL" =~ ^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._~/-]*)?$ ]]
          for value in "$PRODUCTION_R2_BUCKET" "$PRODUCTION_R2_SUBSCRIBERS_BUCKET"; do
            [[ "$value" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]
          done
          [[ "$PRODUCTION_R2_BUCKET" != "$PRODUCTION_R2_SUBSCRIBERS_BUCKET" ]]
          [[ -z "$CERTIFICATE_ARN" || "$CERTIFICATE_ARN" =~ ^arn:aws:acm:us-east-1:650387442642:certificate/[a-f0-9-]+$ ]]
          [[ -z "$ALARM_TOPIC_ARN" || "$ALARM_TOPIC_ARN" == arn:aws:sns:us-east-1:650387442642:portfolio-api-cloud-alerts ]]
          [[ "$PRODUCTION_AWS_ROLE_ARN" == arn:aws:iam::650387442642:role/PortfolioApiCloudTestGitHubDeployRole ]]
          [[ "$PRODUCTION_EXECUTION_ROLE_ARN" == arn:aws:iam::650387442642:role/PortfolioApiCloudTestCloudFormationExecutionRole ]]
          [[ "$PRODUCTION_CDK_DEPLOY_ROLE_ARN" == arn:aws:iam::650387442642:role/PortfolioApiCloudTestCdkDeployRole ]]
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Recover the reviewed CI artifact before AWS authentication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$REVIEWED_REVISION" "$GITHUB_SHA"
          mkdir -p .tmp
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" > .tmp/source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > .tmp/source-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > .tmp/source-artifact.zip
          python3 scripts/recover_bundle.py .tmp/source-artifact.zip .tmp/source-artifact.json .tmp/source-run.json .tmp/recovered "$REVIEWED_REVISION" "$REVIEWED_DIGEST"
          cmp package-lock.json .tmp/recovered/package-lock.json
          [[ "$(node --version)" == v24.22.1 ]]
      - name: Validate the recovered target
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('.tmp/recovered/cdk.out/manifest.json').read_text())
          stacks = [(key, value) for key, value in manifest['artifacts'].items() if value['type'] == 'aws:cloudformation:stack']
          assert len(stacks) == 1, 'Solo se permite una stack de test'
          name, stack = stacks[0]
          assert name == 'PortfolioApiCloudTest'
          assert stack['environment'] == 'aws://650387442642/us-east-1'
          assert stack['properties']['stackName'] == 'portfolio-api-cloud-test'
          assert stack['properties']['cloudFormationExecutionRoleArn'] == os.environ['PRODUCTION_EXECUTION_ROLE_ARN']
          assert stack['properties']['assumeRoleArn'] == os.environ['PRODUCTION_CDK_DEPLOY_ROLE_ARN']
          assert stack['properties']['requiresBootstrapStackVersion'] == 6
          assert manifest['minimumCliVersion'] == '2.1146.1'
          review = json.loads(Path('.tmp/recovered/review.json').read_text())
          assert review['nodeVersion'] == 'v24.22.1'
          template = json.loads(Path('.tmp/recovered/cdk.out/' + stack['properties']['templateFile']).read_text())
          import sys
          sys.path.insert(0, 'scripts')
          from review_changeset import check_catalog
          check_catalog(template, validation=False)
          assets = json.loads(Path('.tmp/recovered/cdk.out/PortfolioApiCloudTest.assets.json').read_text())
          assert not assets.get('dockerImages')
          assert assets['files']
          for asset in assets['files'].values():
              for destination in asset['destinations'].values():
                  assert destination['bucketName'] == 'cdk-papiatest-assets-650387442642-us-east-1'
                  assert destination['region'] == 'us-east-1'
                  assert destination['assumeRoleArn'] == 'arn:aws:iam::650387442642:role/PortfolioApiCloudTestFilePublishingRole'
          PY
      - name: Retain the exact reviewed assembly before authentication
        run: |
          python3 scripts/review_bundle.py verify .tmp/recovered "$REVIEWED_REVISION"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: production-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/recovered/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.PRODUCTION_AWS_ROLE_ARN }}
          allowed-account-ids: '650387442642'
          role-session-name: PortfolioApiCloudTest-${{ github.run_id }}
      - name: Verify personal test identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 650387442642 ]]
          caller_arn=$(aws sts get-caller-identity --query Arn --output text)
          [[ "$caller_arn" == arn:aws:sts::650387442642:assumed-role/PortfolioApiCloudTestGitHubDeployRole/* ]]
          [[ "$AWS_REGION" == us-east-1 ]]
      - name: Require the runtime parameters before preparing
        shell: bash
        run: |
          set -euo pipefail
          # Solo metadatos, sin descifrar; falla si falta alguno o no es SecureString.
          names=(/portfolio/prod/api /portfolio/prod/chat /portfolio/prod/editorial /portfolio/prod/notifications)
          aws ssm get-parameters --region us-east-1 --names "${names[@]}" --query '{found:Parameters[].{Name:Name,Type:Type,Version:Version},invalid:InvalidParameters}' --output json > .tmp/parameters.json
          python3 -I - "${names[@]}" <<'PY'
          import json, sys
          data = json.load(open('.tmp/parameters.json'))
          found = {item['Name']: item for item in data['found'] or []}
          missing = [name for name in sys.argv[1:] if name not in found]
          wrong = [name for name, item in found.items() if item['Type'] != 'SecureString']
          if data['invalid'] or missing or wrong:
              sys.exit(f'Parámetros de runtime ausentes o no SecureString: {sorted(set(missing + wrong + (data["invalid"] or [])))}')
          for name in sys.argv[1:]:
              print(f"{name}: SecureString v{found[name]['Version']}")
          PY
          rm -f .tmp/parameters.json
      - name: Publish assets and prepare a change set without execution
        shell: bash
        run: |
          set -euo pipefail
          change_set="portfolio-api-cloud-test-${REVIEWED_REVISION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npm run cdk -- deploy PortfolioApiCloudTest --app .tmp/recovered/cdk.out --exclusively --method prepare-change-set --change-set-name "$change_set" --require-approval never --parameters RuntimePermissionsBoundaryArn=arn:aws:iam::650387442642:policy/PortfolioApiCloudTestRuntimeBoundary --parameters "PublicAccess=$PUBLIC_ACCESS" --parameters "CorsOrigin=$CORS_ORIGIN" --parameters "CertificateArn=$CERTIFICATE_ARN" --parameters "DisableDefaultEndpoint=$DISABLE_DEFAULT_ENDPOINT" --parameters "AlarmTopicArn=$ALARM_TOPIC_ARN" --parameters "ContactFromEmail=$PRODUCTION_CONTACT_FROM_EMAIL" --parameters "ContactToEmail=$PRODUCTION_CONTACT_TO_EMAIL" --parameters "AiDailyBudgetMicrousd=$PRODUCTION_AI_DAILY_BUDGET_MICROUSD" --parameters "AiPricingValidUntil=$PRODUCTION_AI_PRICING_VALID_UNTIL" --parameters "R2Endpoint=$PRODUCTION_R2_ENDPOINT" --parameters "R2Bucket=$PRODUCTION_R2_BUCKET" --parameters "R2SubscribersBucket=$PRODUCTION_R2_SUBSCRIBERS_BUCKET" --parameters "MediaBaseUrl=$PRODUCTION_MEDIA_BASE_URL" --parameters "BlogFromEmail=$PRODUCTION_BLOG_FROM_EMAIL"
          echo "Changeset test preparado: $change_set. No se ejecutó el despliegue." >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.PRODUCTION_CDK_DEPLOY_ROLE_ARN }}
          role-chaining: true
          role-skip-session-tagging: true
          allowed-account-ids: '650387442642'
          role-session-name: PortfolioApiCloudTestReview-${{ github.run_id }}
      - name: Capture the exact prepared change set for separate review
        shell: bash
        run: |
          set -euo pipefail
          change_set="portfolio-api-cloud-test-${REVIEWED_REVISION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws cloudformation describe-change-set --region us-east-1 --stack-name portfolio-api-cloud-test --change-set-name "$change_set" --query '{stack:StackId,changeset:ChangeSetId}' > .tmp/targets.json
          stack_arn=$(jq -r .stack .tmp/targets.json)
          changeset_arn=$(jq -r .changeset .tmp/targets.json)
          export REVIEWED_ASSEMBLY=.tmp/recovered/cdk.out
          digest=$(python3 scripts/review_changeset.py snapshot "$stack_arn" "$changeset_arn" application .tmp/changeset-review.json)
          echo "Stack: $stack_arn; changeset: $changeset_arn; revisión: $REVIEWED_REVISION; recibo: $digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: prepared-changeset-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/changeset-review.json
          if-no-files-found: error
          retention-days: 30
