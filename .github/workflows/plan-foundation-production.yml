name: Plan production foundation
on:
  workflow_dispatch:
    inputs:
      reviewed_template_digest:
        description: SHA256 del template de fundación revisado en main
        type: string
        required: true
      runtime_secret_arn:
        description: ARN exacto del secreto de validación ya provisionado
        type: string
        required: true
      change_set_type:
        description: Tipo revisado según inventario previo
        type: choice
        options: [CREATE, UPDATE]
        required: true
permissions:
  contents: read
concurrency:
  group: portfolio-api-cloud-production-mutation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'matigaleanodev/portfolio-api-cloud' && github.ref == 'refs/heads/main' && vars.PRODUCTION_FOUNDATION_ENABLED == 'true'
    environment: production-foundation-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      TEMPLATE_DIGEST: ${{ inputs.reviewed_template_digest }}
      RUNTIME_SECRET_ARN: ${{ inputs.runtime_secret_arn }}
      CHANGE_SET_TYPE: ${{ inputs.change_set_type }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check the exact foundation before authentication
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TEMPLATE_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$(sha256sum infra/production-foundation.template.json | cut -d ' ' -f1)" == "$TEMPLATE_DIGEST" ]]
          [[ "$RUNTIME_SECRET_ARN" =~ ^arn:aws:secretsmanager:us-east-1:650387442642:secret:portfolio-api-cloud/test/[A-Za-z0-9/_+=.@-]+$ ]]
          [[ "$CHANGE_SET_TYPE" == CREATE || "$CHANGE_SET_TYPE" == UPDATE ]]
          [[ "$(wc -c < infra/production-foundation.template.json)" -le 51200 ]]
          mkdir -p .tmp
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::650387442642:role/PortfolioApiCloudTestFoundationPlanRole
          allowed-account-ids: '650387442642'
          role-session-name: PortfolioApiCloudTestFoundation-${{ github.run_id }}
      - name: Prepare foundation only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 650387442642 ]]
          caller_arn=$(aws sts get-caller-identity --query Arn --output text)
          [[ "$caller_arn" == arn:aws:sts::650387442642:assumed-role/PortfolioApiCloudTestFoundationPlanRole/* ]]
          change_set="portfolio-api-cloud-test-foundation-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws cloudformation create-change-set --region us-east-1 --stack-name portfolio-api-cloud-test-foundation --change-set-name "$change_set" --change-set-type "$CHANGE_SET_TYPE" --template-body file://infra/production-foundation.template.json --role-arn arn:aws:iam::650387442642:role/PortfolioApiCloudTestFoundationCloudFormationRole --capabilities CAPABILITY_NAMED_IAM --parameters "ParameterKey=RuntimeSecretArn,ParameterValue=$RUNTIME_SECRET_ARN" ParameterKey=AllowRegionalApiBootstrap,ParameterValue=false ParameterKey=TestApiId,ParameterValue=9vxryiyill > .tmp/targets.json
          stack_arn=$(jq -r .StackId .tmp/targets.json)
          changeset_arn=$(jq -r .Id .tmp/targets.json)
          aws cloudformation wait change-set-create-complete --region us-east-1 --stack-name "$stack_arn" --change-set-name "$changeset_arn"
          export REVIEWED_FOUNDATION=infra/production-foundation.template.json
          digest=$(python3 scripts/review_changeset.py snapshot "$stack_arn" "$changeset_arn" foundation .tmp/foundation-review.json)
          echo "Stack: $stack_arn; changeset: $changeset_arn; template: $TEMPLATE_DIGEST; recibo: $digest. Sin ejecución." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: foundation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            infra/production-foundation.template.json
            .tmp/foundation-review.json
          if-no-files-found: error
          retention-days: 30
