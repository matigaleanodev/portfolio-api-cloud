name: Prepare test deployment

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Run CI por push de la revisión integrada
        type: string
        required: true
      artifact_id:
        description: Artifact test-assembly del run revisado
        type: string
        required: true
      reviewed_revision:
        description: SHA completo integrado y revisado
        type: string
        required: true
      reviewed_digest:
        description: Digest sha256 del artifact revisado en GitHub
        type: string
        required: true

      public_access:
        description: Exposicion publica tras validar candidata
        type: boolean
        default: false
      cors_origin:
        description: Origenes HTTPS permitidos separados por coma
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: portfolio-api-cloud-test-mutation
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CDK_DEFAULT_ACCOUNT: '650387442642'
  CDK_DEFAULT_REGION: us-east-1

jobs:
  prepare:
    if: github.repository == 'matigaleanodev/portfolio-api-cloud' && github.ref == 'refs/heads/main' && vars.TEST_PLAN_ENABLED == 'true'
    environment: test-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PUBLIC_ACCESS: ${{ inputs.public_access }}
      CORS_ORIGIN: ${{ inputs.cors_origin }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      REVIEWED_REVISION: ${{ inputs.reviewed_revision }}
      REVIEWED_DIGEST: ${{ inputs.reviewed_digest }}
      TEST_RUNTIME_SECRET_ARN: ${{ vars.TEST_RUNTIME_SECRET_ARN }}
      TEST_AWS_ROLE_ARN: ${{ vars.TEST_AWS_ROLE_ARN }}
      TEST_EXECUTION_ROLE_ARN: ${{ vars.TEST_EXECUTION_ROLE_ARN }}
      TEST_CDK_DEPLOY_ROLE_ARN: ${{ vars.TEST_CDK_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check prerequisites before authentication
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEWED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REVIEWED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test -f package.json
          test -f package-lock.json
          test -f cdk.json
          [[ "$TEST_RUNTIME_SECRET_ARN" =~ ^arn:aws:secretsmanager:us-east-1:650387442642:secret:portfolio-api-cloud/test/[A-Za-z0-9/_+=.@-]+$ ]]
          [[ "$TEST_AWS_ROLE_ARN" == arn:aws:iam::650387442642:role/PortfolioApiCloudTestGitHubDeployRole ]]
          [[ "$TEST_EXECUTION_ROLE_ARN" == arn:aws:iam::650387442642:role/PortfolioApiCloudTestCloudFormationExecutionRole ]]
          [[ "$TEST_CDK_DEPLOY_ROLE_ARN" == arn:aws:iam::650387442642:role/PortfolioApiCloudTestCdkDeployRole ]]
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Recover the reviewed CI artifact before AWS authentication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$REVIEWED_REVISION" "$GITHUB_SHA"
          mkdir -p .tmp
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" > .tmp/source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > .tmp/source-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > .tmp/source-artifact.zip
          python3 scripts/recover_bundle.py .tmp/source-artifact.zip .tmp/source-artifact.json .tmp/source-run.json .tmp/recovered "$REVIEWED_REVISION" "$REVIEWED_DIGEST"
          cmp package-lock.json .tmp/recovered/package-lock.json
          [[ "$(node --version)" == v24.22.1 ]]
      - name: Validate the recovered target
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('.tmp/recovered/cdk.out/manifest.json').read_text())
          stacks = [(key, value) for key, value in manifest['artifacts'].items() if value['type'] == 'aws:cloudformation:stack']
          assert len(stacks) == 1, 'Solo se permite una stack de test'
          name, stack = stacks[0]
          assert name == 'PortfolioApiCloudTest'
          assert stack['environment'] == 'aws://650387442642/us-east-1'
          assert stack['properties']['stackName'] == 'portfolio-api-cloud-test'
          assert stack['properties']['cloudFormationExecutionRoleArn'] == os.environ['TEST_EXECUTION_ROLE_ARN']
          assert stack['properties']['assumeRoleArn'] == os.environ['TEST_CDK_DEPLOY_ROLE_ARN']
          assert stack['properties']['requiresBootstrapStackVersion'] == 6
          assert manifest['minimumCliVersion'] == '2.1146.1'
          review = json.loads(Path('.tmp/recovered/review.json').read_text())
          assert review['nodeVersion'] == 'v24.22.1'
          template = json.loads(Path('.tmp/recovered/cdk.out/' + stack['properties']['templateFile']).read_text())
          functions = [r['Properties'] for r in template['Resources'].values() if r['Type'] == 'AWS::Lambda::Function']
          assert len(functions) == 1 and functions[0]['Handler'] == 'dist/handler.handler', 'Se requiere el paquete productivo sin dobles'
          assets = json.loads(Path('.tmp/recovered/cdk.out/PortfolioApiCloudTest.assets.json').read_text())
          assert not assets.get('dockerImages')
          assert assets['files']
          for asset in assets['files'].values():
              for destination in asset['destinations'].values():
                  assert destination['bucketName'] == 'cdk-papiatest-assets-650387442642-us-east-1'
                  assert destination['region'] == 'us-east-1'
                  assert destination['assumeRoleArn'] == 'arn:aws:iam::650387442642:role/PortfolioApiCloudTestFilePublishingRole'
          PY
      - name: Retain the exact reviewed assembly before authentication
        run: |
          python3 scripts/review_bundle.py verify .tmp/recovered "$REVIEWED_REVISION"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: test-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/recovered/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.TEST_AWS_ROLE_ARN }}
          allowed-account-ids: '650387442642'
          role-session-name: PortfolioApiCloudTest-${{ github.run_id }}
      - name: Verify personal test identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 650387442642 ]]
          caller_arn=$(aws sts get-caller-identity --query Arn --output text)
          [[ "$caller_arn" == arn:aws:sts::650387442642:assumed-role/PortfolioApiCloudTestGitHubDeployRole/* ]]
          [[ "$AWS_REGION" == us-east-1 ]]
      - name: Publish assets and prepare a change set without execution
        shell: bash
        run: |
          set -euo pipefail
          change_set="portfolio-api-cloud-test-${REVIEWED_REVISION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npm run cdk -- deploy PortfolioApiCloudTest --app .tmp/recovered/cdk.out --exclusively --method prepare-change-set --change-set-name "$change_set" --require-approval never --parameters RuntimePermissionsBoundaryArn=arn:aws:iam::650387442642:policy/PortfolioApiCloudTestRuntimeBoundary --parameters "RuntimeSecretArn=$TEST_RUNTIME_SECRET_ARN" --parameters "PublicAccess=$PUBLIC_ACCESS" --parameters "CorsOrigin=$CORS_ORIGIN"
          echo "Changeset test preparado: $change_set. No se ejecutó el despliegue." >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.TEST_CDK_DEPLOY_ROLE_ARN }}
          role-chaining: true
          role-skip-session-tagging: true
          allowed-account-ids: '650387442642'
          role-session-name: PortfolioApiCloudTestReview-${{ github.run_id }}
      - name: Capture the exact prepared change set for separate review
        shell: bash
        run: |
          set -euo pipefail
          change_set="portfolio-api-cloud-test-${REVIEWED_REVISION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws cloudformation describe-change-set --region us-east-1 --stack-name portfolio-api-cloud-test --change-set-name "$change_set" --query '{stack:StackId,changeset:ChangeSetId}' > .tmp/targets.json
          stack_arn=$(jq -r .stack .tmp/targets.json)
          changeset_arn=$(jq -r .changeset .tmp/targets.json)
          export REVIEWED_ASSEMBLY=.tmp/recovered/cdk.out
          digest=$(python3 scripts/review_changeset.py snapshot "$stack_arn" "$changeset_arn" application .tmp/changeset-review.json)
          echo "Stack: $stack_arn; changeset: $changeset_arn; revisión: $REVIEWED_REVISION; recibo: $digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: prepared-changeset-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/changeset-review.json
          if-no-files-found: error
          retention-days: 30
