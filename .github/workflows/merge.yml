name: Merge approved pull request

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Numero del PR existente hacia main o dev
        type: string
        required: true
      reviewed_head_sha:
        description: SHA completo del head revisado
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: portfolio-api-cloud-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.repository == 'matigaleanodev/portfolio-api-cloud' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || (github.ref == 'refs/heads/feat/migration-evidence-docs' && vars.MERGE_RECOVERY_HEAD_SHA != '' && github.sha == vars.MERGE_RECOVERY_HEAD_SHA)) && vars.MERGE_WORKFLOW_ENABLED == 'true'
    environment: merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ inputs.pull_request }}
      REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}
      GH_REPO: matigaleanodev/portfolio-api-cloud
      MERGE_APP_ID: ${{ vars.MERGE_APP_ID }}
    steps:
      - name: Validate the reviewed PR with read-only token
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEWED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$MERGE_APP_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/reviewed-pr.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pr = json.loads((Path(os.environ['RUNNER_TEMP']) / 'reviewed-pr.json').read_text())
          assert pr['state'] == 'open' and not pr['draft']
          assert pr['head']['sha'] == os.environ['REVIEWED_HEAD_SHA']
          assert pr['head']['repo']['full_name'] == os.environ['GH_REPO']
          assert pr['base']['repo']['full_name'] == os.environ['GH_REPO']
          assert pr['base']['ref'] in ('main', 'dev')
          head = pr['head']['ref']
          assert head.startswith(('feat/', 'fix/', 'release/')) or head in ('main', 'dev')
          assert not head.startswith('codex/')
          assert head != pr['base']['ref']
          PY
          gh pr checks "$PR_NUMBER" --repo "$GH_REPO" --required
      - name: Obtain the dedicated merge App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
          owner: matigaleanodev
          repositories: portfolio-api-cloud
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-workflows: write
      - name: Merge only the reviewed head under GitHub rules
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$GH_REPO/pulls/$PR_NUMBER/merge" \
            -f merge_method=merge -f sha="$REVIEWED_HEAD_SHA" \
            > "$RUNNER_TEMP/merge-result.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'merge-result.json').read_text())
          assert result.get('merged') is True, result.get('message', 'Merge no confirmado')
          PY
          gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json state,mergeCommit,url
